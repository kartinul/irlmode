<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IRL Mode</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; text-align: center; background: #000c; }
    .card[hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4.5rem); }
    p { margin: 0; font-size: 1.2rem; }
    button { font: inherit; font-size: 1.3rem; font-weight: bold; padding: 0.8rem 1.6rem; border: 0; border-radius: 999px; background: #ffe14d; color: #000; cursor: pointer; }
    #title { background: #0008; pointer-events: none; transition: opacity 0.6s; }
    #log { position: fixed; top: 0.5rem; right: 0.5rem; z-index: 1; max-width: min(60ch, calc(100vw - 1rem)); max-height: calc(100vh - 1rem); overflow: auto; padding: 0.5rem 0.8rem; border-radius: 8px; background: #000d; font-size: 0.8rem; }
    #log pre { margin: 0.3rem 0 0.6rem; white-space: pre-wrap; opacity: 0.8; }
    #log summary { cursor: pointer; }
    #pick { justify-content: flex-start; overflow: auto; }
    #snaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; width: min(1100px, 100%); }
    #snaps button { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.5rem; border-radius: 12px; background: #222; color: #fff; font-size: 1rem; }
    #snaps img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
    #own summary { cursor: pointer; font-size: 1.1rem; }
    #own input { margin-top: 0.6rem; }
    #loading p::after { content: ""; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 25% { content: "." } 50% { content: ".." } 75% { content: "..." } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <details id="log"><summary>Gemma steps</summary><div id="steps"></div></details>
  <div id="pick" class="card">
    <h1>Pick a Snap</h1>
    <label><input type="checkbox" id="debug" checked> Show debug</label>
    <details id="own"><summary>Upload your own</summary><input type="file" id="upload" accept="image/*"></details>
    <div id="snaps"></div>
  </div>
  <div id="loading" class="card" hidden>
    <p>Gemma is reading your Snap, one question at a time</p>
  </div>
  <div id="error" class="card" hidden>
    <p>Gemma couldn't read that Snap.</p>
    <button id="retry">Try again</button>
  </div>
  <div id="title" class="card" hidden><h1 id="level-name"></h1></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
